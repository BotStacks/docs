name: Docs build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check routes, SEO and responsive navigation
        run: |
          python3 -m http.server 4321 --directory build >/tmp/docs-server.log 2>&1 &
          node scripts/verify-docs.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-site
          path: |
            build
            test-results/docs
